<style>
:root{
  /* One visual world: ink on paper. Colour belongs to money; bodies stay neutral and carry their layer as a pale tint.
     Layout: full-bleed board, header top-left, reading panel right, time along the bottom. */
  color-scheme: light;
  --paper:#F6F5F1; --paper-2:#EFEDE7; --card:#FFFFFF; --line:#DEDBD3; --line-2:#C8C4BA;
  --ink:#16171B; --ink-2:#3B3E46; --muted:#6C717D; --dim:#9AA0AA;
  --equity:#1F5BD6; --commit:#E0561C; --capex:#12865A; --debt:#8A3EC8; --link:#8E939C;
  --t-applications:#FBE7EE; --t-models:#E6EDFB; --t-infrastructure:#E2F2E9; --t-chips:#FCEEDC; --t-energy:#F7F0D3; --t-capital:#EDEBE6;
  --ok:#1E7F4C; --warn:#A86A12; --bad:#BF3A2B; --release:#C0266D;
  --sans:"Anthropic Sans","Hanken Grotesk",system-ui,-apple-system,"Segoe UI",sans-serif;
  --mono:"Anthropic Mono","JetBrains Mono",ui-monospace,Menlo,Consolas,monospace;
}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:var(--paper);color:var(--ink);font:14px/1.45 var(--sans);overflow:hidden;-webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
a{color:var(--equity);text-underline-offset:2px}
:focus-visible{outline:2px solid var(--equity);outline-offset:2px;border-radius:4px}
.num{font-family:var(--mono);font-variant-numeric:tabular-nums}
#stage{position:fixed;inset:0;display:block;width:100%;height:100%;touch-action:none}
#stage.drag{cursor:grabbing !important}
#msg{position:fixed;inset:0;display:grid;place-items:center;color:var(--muted);padding:24px;text-align:center}

header{position:fixed;left:24px;top:18px;max-width:min(620px,calc(100vw - 940px));min-width:min(420px,calc(100vw - 420px));pointer-events:none}
h1{font:700 30px/1.05 var(--sans);letter-spacing:-.02em;margin:0 0 6px;text-wrap:balance}
.sub{color:var(--ink-2);margin:0 0 12px;font-size:13.5px;max-width:52ch}
.stats{display:flex;flex-wrap:wrap;gap:6px 22px}
.stat b{display:block;font:600 18px var(--mono);font-variant-numeric:tabular-nums;letter-spacing:-.01em}
.stat span{color:var(--muted);font-size:11.5px}
.stat.total{flex-basis:100%}
.split{display:flex;height:8px;border-radius:2px;overflow:hidden;margin:6px 0 5px;max-width:440px;background:var(--paper-2)}
.split i{display:block;min-width:2px}
.s-moved{background:var(--ink)} .s-signed{background:#646872} .s-ann{background:#B9BDC5} .s-press{background:repeating-linear-gradient(135deg,var(--warn) 0 2px,#F3E6D2 2px 5px)}
.skey{display:flex;flex-wrap:wrap;gap:2px 12px;font-size:11.5px;color:var(--ink-2);max-width:560px}
.skey i{display:inline-block;width:9px;height:9px;border-radius:2px;margin-right:4px;vertical-align:-1px}
.skey .gross{color:var(--muted);flex-basis:100%}
.mini{display:none;font-size:11.5px;color:var(--muted);line-height:1.45;flex-basis:100%}
.mini b{font:600 12.5px var(--mono);color:var(--ink)}
@media (min-width:821px) and (max-width:1560px){ .stat:not(.total){display:none} .mini{display:block} .sub{margin-bottom:8px} }
.show{display:flex;flex-wrap:wrap;gap:4px;align-items:center;align-self:flex-end;pointer-events:auto;font-size:11.5px;color:var(--muted)}
.show button{border:1px solid var(--line-2);border-radius:999px;padding:2px 9px;background:#ffffffd9;font-size:11.5px;color:var(--ink-2)}
.show button[aria-pressed="true"]{background:var(--ink);color:var(--paper);border-color:var(--ink)}
#find{border:1px solid var(--line-2);background:#ffffffd9;border-radius:999px;padding:6px 12px;font:500 12.5px var(--sans);width:150px;color:var(--ink)}
#find:focus{outline:2px solid var(--equity);outline-offset:1px}
.seg{display:inline-flex;gap:4px;margin:2px 0 6px}
.seg button{border:1px solid var(--line-2);border-radius:999px;padding:3px 10px;font-size:12px}
.seg button[aria-pressed="true"]{background:var(--ink);color:var(--paper);border-color:var(--ink)}
.chip.unchecked{border-style:dotted;color:var(--ink-2)}
#tour{position:fixed;left:24px;bottom:124px;width:350px;background:var(--card);border:1px solid var(--ink);border-radius:12px;padding:12px 14px 12px;box-shadow:0 10px 28px #0000002a;z-index:6}
#edition{display:block;margin:0 0 8px;font:600 11px var(--mono);letter-spacing:.06em;text-transform:uppercase;color:var(--ink);pointer-events:auto}
#edition a{color:inherit}
#tour p{margin:6px 0 10px;font-size:13.5px;color:var(--ink-2)}
#tour .acts{display:flex;justify-content:flex-end;gap:6px}
#tour .acts .on{background:var(--ink);color:var(--paper);border-color:var(--ink)}

.tools{position:fixed;right:392px;top:16px;display:flex;gap:6px;flex-wrap:wrap;justify-content:flex-end;max-width:520px}
.btn{border:1px solid var(--line-2);background:#ffffffd9;border-radius:999px;padding:6px 12px;font-size:12.5px;font-weight:500;backdrop-filter:blur(6px)}
.btn:hover{border-color:var(--ink-2)}
.btn[aria-pressed="true"]{background:var(--ink);color:var(--paper);border-color:var(--ink)}
.btn[disabled]{opacity:.5;cursor:not-allowed}

#sheet{position:fixed;right:0;top:0;bottom:0;width:376px;background:var(--card);border-left:1px solid var(--line);display:flex;flex-direction:column}
#panel{flex:1;min-height:0;overflow:auto;padding:20px 20px 110px}
#sab{position:fixed;bottom:0;left:0;width:0;height:env(safe-area-inset-bottom);visibility:hidden;pointer-events:none}
aside h2{font:700 24px/1.1 var(--sans);letter-spacing:-.015em;margin:2px 0 4px;text-wrap:balance}
aside h3{font:600 11px var(--mono);letter-spacing:.08em;text-transform:uppercase;color:var(--muted);margin:22px 0 8px}
.kicker{font:500 11px var(--mono);color:var(--muted);letter-spacing:.06em;text-transform:uppercase}
.back{font-size:12.5px;color:var(--muted);padding:0 0 10px}
.back:hover{color:var(--ink)}
.note{color:var(--ink-2);font-size:12.8px;margin:6px 0 0}
.row{display:block;width:100%;text-align:left;border-top:1px solid var(--line);padding:9px 0}
button.row:hover{background:var(--paper)}
.row .t{display:flex;gap:8px;align-items:baseline;justify-content:space-between}
.row .t b{font-weight:600}
.row .m{color:var(--muted);font-size:12px;margin-top:2px}
.row .amt{font:600 13px var(--mono);white-space:nowrap}
.chip{display:inline-block;font:600 9.5px var(--mono);letter-spacing:.05em;text-transform:uppercase;border-radius:3px;padding:1px 5px;border:1px solid var(--line-2);color:var(--muted);vertical-align:1px}
.chip.filed{background:var(--ink);color:var(--paper);border-color:var(--ink)}
.chip.announced{border-color:var(--ink);color:var(--ink)}
.chip.reported{border-style:dashed;color:var(--warn);border-color:var(--warn)}
.sw{display:inline-block;width:18px;height:0;border-top:3px solid;vertical-align:middle;margin-right:6px;border-radius:2px}
.ents{display:flex;flex-wrap:wrap;gap:6px}
.ents .btn{background:var(--card)}
.grp{margin:8px 0 2px;font:600 10px var(--mono);letter-spacing:.08em;text-transform:uppercase;color:var(--dim)}
.bars{display:flex;align-items:flex-end;gap:4px;height:70px;margin-top:6px}
.bars i{flex:1;background:#BFD9CB;border-radius:2px 2px 0 0;min-height:2px}
.bars i.d{background:repeating-linear-gradient(135deg,#BFD9CB 0 3px,#E7F1EB 3px 6px)}
.bars i.last{background:var(--capex)}
.axis{display:flex;justify-content:space-between;color:var(--dim);font:11px var(--mono);margin-top:3px}
.def{color:var(--ink-2);font-size:12.5px;margin:4px 0 0}

#time{position:fixed;left:24px;right:400px;bottom:14px;background:#ffffffe6;border:1px solid var(--line);border-radius:12px;padding:9px 14px 8px;backdrop-filter:blur(8px)}
.trow{display:flex;align-items:center;gap:12px}
#play{border:1px solid var(--line-2);border-radius:999px;width:32px;height:32px;flex:none;font-size:11px;background:var(--card)}
#asof{font:600 13px var(--mono);min-width:104px}
.track{position:relative;flex:1;height:32px}
.track input{position:absolute;inset:0;width:100%;margin:0;appearance:none;-webkit-appearance:none;background:transparent;height:32px}
.track input::-webkit-slider-runnable-track{height:2px;background:var(--line-2)}
.track input::-moz-range-track{height:2px;background:var(--line-2)}
.track input::-webkit-slider-thumb{-webkit-appearance:none;width:14px;height:22px;border-radius:3px;background:var(--ink);margin-top:-10px;border:0}
.track input::-moz-range-thumb{width:14px;height:22px;border-radius:3px;background:var(--ink);border:0}
.ticks{position:absolute;left:7px;right:7px;top:0;height:32px;pointer-events:none}
.ticks i{position:absolute;top:6px;width:2px;height:8px;background:var(--ink-2);border-radius:1px}
.ticks i.reported{background:var(--warn)}
.ticks i.rel{background:var(--release);width:3px;top:3px;height:12px}
.rel-row .m b{color:var(--ink-2);font-weight:600}
.tag{display:inline-block;font:600 9.5px var(--mono);letter-spacing:.04em;text-transform:uppercase;border-radius:3px;padding:1px 5px;color:var(--release);border:1px solid var(--release);vertical-align:1px}
.mchart{width:100%;height:96px;display:block;margin-top:6px;overflow:visible}
.mchart text{font:10px var(--mono);fill:var(--muted)}
.latest td{padding:5px 6px 5px 0;vertical-align:top}
.latest button{color:var(--ink);font-weight:600;text-align:left}
.ticks span{position:absolute;bottom:-3px;font:10.5px var(--mono);color:var(--dim);transform:translateX(-50%)}
.legend{display:flex;flex-wrap:wrap;gap:4px 14px;color:var(--ink-2);font-size:11.5px;margin-top:6px;align-items:center}
.legend svg{vertical-align:middle;margin-right:5px}
.legend .sep{width:1px;height:14px;background:var(--line-2)}

#drawer{position:fixed;left:24px;right:400px;top:150px;bottom:112px;background:var(--card);border:1px solid var(--line-2);border-radius:12px;overflow:auto;padding:16px 18px;display:none;box-shadow:0 10px 30px #0000001a}
#drawer.open{display:block}
#d-close{position:sticky;top:0;float:right;margin:-6px -8px 0 8px;width:30px;height:30px;border-radius:50%;border:1px solid var(--line-2);background:#fff;font-size:18px;line-height:1;color:var(--ink-2);z-index:2}
#drawer h2{font:700 22px var(--sans);margin:0 0 4px}
.seg{display:inline-flex;gap:4px;margin:2px 0 0 10px;vertical-align:4px}
.seg button{border:1px solid var(--line-2);border-radius:999px;padding:2px 10px;background:#fff;font-size:12px;color:var(--ink-2)}
.seg button[aria-pressed="true"]{background:var(--ink);color:var(--paper);border-color:var(--ink)}
.lstrip{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin:10px 0 4px}
.lstrip .k{font:600 10.5px var(--mono);letter-spacing:.06em;text-transform:uppercase;color:var(--muted);margin-right:4px}
.lchip{border:1px solid var(--line-2);border-radius:999px;padding:3px 10px;background:#fff;font-size:12px;color:var(--ink-2);display:inline-flex;gap:6px;align-items:baseline}
.lchip .c{font:700 12px var(--mono);color:var(--ink)} .lchip span:last-child{font:11px var(--mono);color:var(--muted)}
.lgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(340px,1fr));gap:12px;margin-top:8px;align-items:start}
@media (max-width:820px){.lgrid{grid-template-columns:1fr}}
.lstar{margin:0;border:1px solid var(--line);border-radius:10px;padding:8px 8px 2px;background:var(--paper)}
.lstar figcaption{font-size:13px;color:var(--ink-2);padding:2px 4px} .lstar figcaption span{display:block;font:11px var(--mono);color:var(--muted);margin-top:2px}
.lm{display:block;max-width:100%;height:auto;margin:0 auto}
.lmbox.hot .lchip{opacity:.4} .lmbox.hot .lchip.on{opacity:1;border-color:var(--ink)}
.lm text{font-family:var(--sans)} .lm .mono{font-family:var(--mono)}
.lm .lbl{paint-order:stroke;stroke:#fff;stroke-width:4px;stroke-linejoin:round}
.lm .lp{transition:opacity .15s} .lmbox.hot .lp{opacity:.12} .lmbox.hot .lp.on{opacity:1}
.lm .nd{cursor:pointer} .lm path[data-flowlink]{cursor:pointer}
.lmbox.hot .nd{opacity:.3} .lmbox.hot .nd.on{opacity:1}
#drawer h3{font:600 11px var(--mono);letter-spacing:.08em;text-transform:uppercase;color:var(--muted);margin:18px 0 6px}
table{border-collapse:collapse;width:100%;font-size:12.5px}
th{text-align:left;color:var(--muted);font-weight:600;border-bottom:1px solid var(--line-2);padding:5px 8px 5px 0;position:sticky;top:-16px;background:var(--card)}
td{border-bottom:1px solid var(--line);padding:5px 8px 5px 0;vertical-align:top}
td.r,th.r{text-align:right}
.pass{color:var(--ok)} .fail{color:var(--bad)} .warn{color:var(--warn)}

/* ---------- phones: a top bar with three tabs, the map as a vertical stack, details in a bottom sheet ---------- */
#mbar,#mmenu,#msearch,#m-fit,#grab,#mscrim,.ph-only{display:none}
body.phone .ph-only,body.land .ph-only{display:block}
body.phone .desk-only,body.land .desk-only{display:none}
body.phone header,body.land header,body.phone .tools,body.land .tools{display:none}
body.phone,body.land{-webkit-text-size-adjust:100%}
body.phone button,body.land button{touch-action:manipulation;-webkit-tap-highlight-color:transparent}
body.phone #mbar,body.land #mbar{display:grid;position:fixed;left:0;right:0;top:0;z-index:5;background:#F6F5F1EB;-webkit-backdrop-filter:blur(12px);backdrop-filter:blur(12px);border-bottom:1px solid var(--line);padding:calc(env(safe-area-inset-top) + 8px) max(12px,env(safe-area-inset-right)) 8px max(12px,env(safe-area-inset-left));gap:8px 6px;align-items:center;-webkit-user-select:none;user-select:none}
body.phone #mbar{grid-template-columns:1fr auto auto;grid-template-areas:"t f m" "s s s"}
body.land #mbar{grid-template-columns:auto minmax(240px,360px) 1fr auto auto;grid-template-areas:"t s . f m";padding-top:6px;padding-bottom:6px}
.mt{grid-area:t;min-width:0}
.mt b{display:block;font:700 17px/1.15 var(--sans);letter-spacing:-.015em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.mt span{display:block;font:600 9.5px var(--mono);letter-spacing:.06em;text-transform:uppercase;color:var(--warn);margin-top:2px}
.mic{width:40px;height:40px;border-radius:50%;border:1px solid var(--line-2);background:#fff;display:grid;place-items:center;color:var(--ink)}
#m-find{grid-area:f} #m-menu{grid-area:m}
.mseg{grid-area:s;display:flex;gap:3px;padding:3px;border-radius:11px;background:var(--paper-2);border:1px solid var(--line)}
.mseg button{flex:1;height:34px;border-radius:8px;font:600 13.5px var(--sans);color:var(--ink-2)}
.mseg button[aria-pressed="true"]{background:#fff;color:var(--ink);box-shadow:0 1px 3px #00000024}
body.phone #sheet{top:auto;left:0;right:0;bottom:0;width:auto;height:var(--sheet-h,60vh);border-left:0;border-top:1px solid var(--line-2);border-radius:16px 16px 0 0;box-shadow:0 -10px 30px #0000001f;transform:translateY(var(--sheet-off,0px));transition:transform .32s cubic-bezier(.2,.85,.25,1);z-index:6}
body.phone #sheet.drag{transition:none}
@media (prefers-reduced-motion:reduce){body.phone #sheet{transition:none}}
body.phone #sheet[data-state="peek"] #panel,body.phone #sheet[data-state="half"] #panel{overflow:hidden;touch-action:none}
body.phone #grab{display:block;position:relative;height:28px;flex:none;touch-action:none}
#grab-btn{position:absolute;inset:0;display:grid;place-items:center;width:100%}
#grab-btn i{display:block;width:40px;height:5px;border-radius:3px;background:var(--line-2)}
#sheet-x{position:absolute;right:10px;top:8px;width:34px;height:34px;border-radius:50%;border:1px solid var(--line-2);background:#fff;font-size:19px;line-height:1;color:var(--ink-2);z-index:1}
body.phone #panel{padding:0 16px calc(28px + env(safe-area-inset-bottom));overscroll-behavior:contain;-webkit-overflow-scrolling:touch}
body.phone .back{display:none}
body.phone aside h2{font-size:22px;padding-right:44px}
body.phone aside .kicker{padding-right:44px}
body.land #sheet{top:var(--mtop);width:320px}
body.land #panel{padding:12px 14px calc(24px + env(safe-area-inset-bottom))}
body.phone #time,body.land #time{left:0;right:0;bottom:var(--peek);border-radius:0;border-width:1px 0 0;padding:3px max(12px,env(safe-area-inset-right)) 1px max(12px,env(safe-area-inset-left));background:#FFFFFFF0;z-index:3}
body.land #time{right:320px;bottom:0}
body.phone .legend,body.land .legend{display:none}

body.phone #drawer,body.land #drawer{left:0;right:0;top:var(--mtop);bottom:calc(var(--peek) + var(--timeh));border:0;border-radius:0;box-shadow:none;padding:14px 14px 28px;z-index:4;overscroll-behavior:contain;-webkit-overflow-scrolling:touch}

body.phone .lchip,body.land .lchip{flex:none}
body.phone #tour{left:10px;right:10px;width:auto;top:calc(var(--mtop) + 10px);bottom:auto;z-index:8}
body.land #tour{left:10px;width:340px;top:auto;bottom:calc(var(--timeh) + 8px);z-index:8}
#mscrim{position:fixed;inset:0;z-index:8;background:#16171b2e}
body.phone #mscrim:not([hidden]),body.land #mscrim:not([hidden]){display:block}
#mmenu{position:fixed;right:10px;top:calc(var(--mtop) + 6px);width:min(310px,calc(100vw - 20px));max-height:calc(var(--vh) - var(--mtop) - 20px);overflow:auto;background:#fff;border:1px solid var(--line-2);border-radius:14px;box-shadow:0 16px 44px #00000038;padding:6px;z-index:9}

#ms-list{flex:1;overflow:auto;padding:4px 12px calc(24px + env(safe-area-inset-bottom));overscroll-behavior:contain}
#ms-list .grp{margin:14px 0 4px}
#ms-list button{display:flex;width:100%;justify-content:space-between;align-items:center;gap:12px;min-height:50px;border-bottom:1px solid var(--line);text-align:left;font-size:16px}
#ms-list button span{font:12px var(--mono);color:var(--muted);white-space:nowrap}
#m-fit{position:fixed;right:12px;top:calc(var(--mtop) + 10px);z-index:3;height:36px;padding:0 14px;border-radius:999px;border:1px solid var(--line-2);background:#fff;font:600 13px var(--sans);box-shadow:0 2px 10px #0000001f}
body.phone #m-fit:not([hidden]),body.land #m-fit:not([hidden]){display:block}
.hl-t{display:flex;align-items:baseline;gap:8px;flex-wrap:wrap;margin-top:1px}
.hl-t b{font:700 27px/1.15 var(--mono);letter-spacing:-.02em}
.hl-t span{color:var(--muted);font-size:12.5px}
.hl .split{max-width:none;margin:7px 0 6px;height:9px}
.hl .skey{font-size:12.5px;gap:3px 14px;max-width:none}
.plegend{display:flex;flex-wrap:wrap;gap:7px 14px;color:var(--ink-2);font-size:12.5px;align-items:center}
.plegend svg{vertical-align:middle;margin-right:6px}
.plegend .sep{display:none}
.peekline{font:600 13px var(--mono);color:var(--ink-2);margin:5px 0 0}
.dchips{display:flex;gap:6px;overflow-x:auto;margin:10px -14px 8px;padding:0 14px 2px;scrollbar-width:none}
.dchips button{flex:none;border:1px solid var(--line-2);border-radius:999px;padding:7px 12px;font-size:13px;background:#fff;color:var(--ink-2)}
.dchips button[aria-pressed="true"]{background:var(--ink);color:var(--paper);border-color:var(--ink)}
.dchips button span{font:12px var(--mono);opacity:.75;margin-left:4px}
.cards{display:flex;flex-direction:column;gap:8px}
.card{display:block;width:100%;text-align:left;background:#fff;border:1px solid var(--line);border-radius:12px;padding:11px 12px}
.card:active{background:var(--paper)}
.card .c1{display:flex;justify-content:space-between;gap:10px;align-items:baseline}
.card .c1 .who{min-width:0}
.card .c1 b{font-weight:650}
.card .amt{font:700 16px var(--mono);white-space:nowrap}
.card .c2{color:var(--ink-2);font-size:13px;margin-top:3px}
.card .c3{color:var(--muted);font-size:12px;margin-top:6px;display:flex;flex-wrap:wrap;gap:4px 10px;align-items:center}
.card .ln{display:inline-block;width:22px;height:0;border-top:3px solid;vertical-align:middle;margin-right:5px;border-radius:2px}
.tscroll{overflow-x:auto;-webkit-overflow-scrolling:touch;margin:0 -14px;padding:0 14px}
.tscroll table{min-width:560px}
details.dsec{border-top:1px solid var(--line);margin-top:14px;padding-top:6px}
details.dsec summary{font:600 11px var(--mono);letter-spacing:.06em;text-transform:uppercase;color:var(--muted);padding:8px 0;cursor:pointer}
.mlist .row{padding:10px 0}
</style>
</head>
<body>
<canvas id="stage" aria-label="Map of money flows in the AI buildout. Use the entity buttons in the side panel to explore without a pointer."></canvas>
<div id="msg">Loading the ledger…</div>

<header>
  <div id="edition" hidden></div>
  <h1>The AI Buildout Ledger</h1>
  <p class="sub">Who pays whom to build AI, read from filings and company announcements. Every line on the map is a sourced row.</p>
  <div class="stats" id="stats"></div>
</header>

<div class="tools">
  <input id="find" list="find-list" placeholder="Find a player" aria-label="Find a player" autocomplete="off"><datalist id="find-list"></datalist>
  <button class="btn" id="b-reset" hidden>Put everything back</button>
  <button class="btn" id="b-layers" aria-pressed="false">Five layers</button>
  <button class="btn" id="b-flow" aria-pressed="false" title="Money runs left to right; deals that run backwards loop over the top">Arranged</button>
  <button class="btn" id="b-labels" aria-pressed="false">All labels</button>
  <button class="btn" id="b-rows" aria-pressed="false">Rows</button>
  <button class="btn" id="b-loops" aria-pressed="false" title="Suppliers putting money into their own customers">Loops</button>
  <button class="btn" id="b-checks" aria-pressed="false">Checks</button>
  <button class="btn" id="b-tour">Tour</button>
  <button class="btn" id="b-export">Export PNG</button>
</div>

<section id="drawer" aria-live="polite"><button id="d-close" aria-label="Close">×</button><div id="drawer-body"></div></section>
<div id="tour" hidden role="dialog" aria-label="Guided start"><div class="kicker" id="tour-k"></div><p id="tour-t"></p><div class="acts"><button class="btn" id="tour-skip">Skip</button><button class="btn on" id="tour-next">Next</button></div></div>
<aside id="sheet" aria-label="Details" data-state="peek"><div id="grab"><button id="grab-btn" aria-label="Show details"><i></i></button><button id="sheet-x" aria-label="Close" hidden>×</button></div><div id="panel" aria-live="polite"></div></aside>
<div id="mbar">
  <div class="mt"><b>The AI Buildout Ledger</b><span id="m-ed" hidden></span></div>
  <div class="mseg" role="tablist" aria-label="View"><button data-mv="map" aria-pressed="true">Map</button><button data-mv="loops" aria-pressed="false">Loops</button><button data-mv="deals" aria-pressed="false">Deals</button></div>
  <button class="mic" id="m-find" aria-label="Find a player"><svg width="18" height="18" viewBox="0 0 18 18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="7.5" cy="7.5" r="5.5"/><path d="M11.8 11.8 16 16"/></svg></button>
  <button class="mic" id="m-menu" aria-label="More options" aria-haspopup="true"><svg width="18" height="18" viewBox="0 0 18 18" fill="currentColor"><circle cx="3.5" cy="9" r="1.8"/><circle cx="9" cy="9" r="1.8"/><circle cx="14.5" cy="9" r="1.8"/></svg></button>
</div>
<div id="mscrim" hidden></div>
<div id="mmenu" role="menu" hidden></div>
<div id="msearch" hidden role="dialog" aria-label="Find a player"><div class="ms-bar"><input id="ms-in" type="search" placeholder="Find a player" autocomplete="off" enterkeyhint="search" aria-label="Find a player"><button id="ms-x">Cancel</button></div><div id="ms-list"></div></div>
<button id="m-fit" hidden>Fit to width</button>
<div id="sab"></div>

<div id="time">
  <div class="trow">
    <button id="play" aria-label="Play timeline">▶</button>
    <div id="asof" class="num"></div>
    <div class="track">
      <div class="ticks" id="ticks"></div>
      <input id="scrub" type="range" min="0" max="100" step="1" value="100" aria-label="Show the ledger as of this date">
    </div>
  </div>
  <div class="legend" id="legend"></div>
</div>

<script>
(() => {
"use strict";
const $ = s => document.querySelector(s);
const css = n => getComputedStyle(document.documentElement).getPropertyValue(n).trim();
const SANS = css('--sans'), MONO = css('--mono');
const COL = {equity:css('--equity'), purchase_commitment:css('--commit'), capex:css('--capex'), debt:css('--debt'), product:css('--link'), uses:css('--link'), owns:css('--link')};
const REL = css('--release');
const TYPE = {equity:'Equity investment', purchase_commitment:'Purchase commitment', capex:'Capital spending', debt:'Debt', product:'Makes (product)', uses:'Uses (no money shown)', owns:'Owns'};
const STATUS = {cash_moved:'Cash moved', contracted:'Contracted', announced:'Announced', reported:'Reported'};
const DASH = {cash_moved:[], contracted:[12,6], announced:[4,6], reported:[1.5,5]};
const KIND = {company:'Company', product:'Product', sink:'Spending sink', instrument:'Financial instrument', investor:'Investor', government:'Government buyer'};
const LAYERS = [{id:'applications',label:'Applications',y:-370},{id:'models',label:'Models',y:-185},{id:'infrastructure',label:'Infrastructure',y:0},{id:'chips',label:'Chips',y:185},{id:'energy',label:'Energy',y:370}];
LAYERS.forEach(l => { l.y0 = l.y; l.h = 168; l.mU = 0; });   // y0: the map's pull; y and h: the five-layer stack, sized to its rows in layout()
const LY = Object.fromEntries(LAYERS.map(l => [l.id, l]));
const BOX = {w:1560, h:168}, CAP = {x:BOX.w / 2 + 70, w:270};
const tint = e => css('--t-' + (e.layer || 'capital'));
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const money = v => v == null ? 'undisclosed' : v >= 1e12 ? '$' + (v/1e12).toFixed(2) + 'T' : v >= 1e11 ? '$' + Math.round(v/1e9) + 'B' : '$' + (v/1e9).toFixed(1) + 'B';
const MON = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
const day = s => { const [y,m,d] = s.split('-').map(Number); return d + ' ' + MON[m-1] + ' ' + y; };
const toN = s => Date.parse(s + 'T00:00:00Z') / 864e5;
const fromN = n => new Date(n * 864e5).toISOString().slice(0,10);
const reduce = matchMedia('(prefers-reduced-motion: reduce)').matches;
const isMoney = f => f.type !== 'product' && f.type !== 'uses' && f.type !== 'owns';
const ease = t => t * t * (3 - 2 * t);

let L, ents = {}, nodes = {}, homeMap = {}, homeCake = {}, T0, T1, tNow, sel = null, hover = null, drawer = null, allLabels = false, loopTab = 'map';
let mGoal = 0, mBlend = 0, fGoal = 0, fBlend = 0, homeFlow = {}, FL = null;
let showMode = 'all', traceDir = 'down', PENDING = new Set(), HEAD = null;
const PAPER = css('--paper');
const cam = {x:0, y:0, k:1, goal:null};
const cv = $('#stage'), ctx = cv.getContext('2d');
let W = 0, H = 0, DPR = 1, panelW = 376, wide = true;
let phone = false, land = false, RECT = null, MTOP = 0, SAB = 0, TIMEH = 0, homeStack = {}, SB = null, ORDER = null, lastStackW = 0, lastCls = '';
let touring = false, TOURB = 0, sheetState = 'peek', VIEW = null, inert = null, PINCH = false, fitShown = false, dealF = 'all', LEGEND = '';
// phones get their own arrangement: portrait phones a bottom sheet, landscape phones a narrow side panel
function classify(){
  W = innerWidth; H = innerHeight;
  const small = W <= 820 || (H <= 500 && W > H);
  land = small && W > H && H <= 500; phone = small && !land; wide = !small; panelW = wide ? 376 : land ? 320 : 0;
  document.body.classList.toggle('phone', phone); document.body.classList.toggle('land', land);
  return phone ? 'phone' : land ? 'land' : 'wide';
}
classify();

fetch('ledger.json').then(r => { if (!r.ok) throw new Error(r.status); return r.json(); }).then(init)
  .catch(e => { $('#msg').textContent = 'The ledger file could not be loaded (' + e.message + '). Reload the page; if it persists, the latest run did not publish.'; });

function init(data){
  L = data; $('#msg').remove();
  if (L.edition){   // a frozen copy for an article: says so, and points to the live map
    const ed = $('#edition'); ed.hidden = false;
    ed.innerHTML = `Edition of ${esc(day(L.edition.date))} · frozen; the daily updates continue on <a href="${esc(L.edition.live_url)}" target="_blank" rel="noopener">the live map</a>`;
    document.title = `The AI Buildout Ledger · ${day(L.edition.date)} edition`;
  }
  PENDING = new Set(((L.verification && L.verification.pending) || []).map(x => x.split('@')[0]));   // rows the independent check hasn't reached yet
  L.entities.forEach(e => ents[e.id] = e);
  T0 = toN('2025-07-01'); T1 = toN(L.as_of); tNow = T1;
  const sc = $('#scrub'); sc.min = T0; sc.max = T1; sc.value = T1;
  sc.addEventListener('input', () => { stopPlay(); tNow = +sc.value; refresh(); });
  if (L.edition){ $('#m-ed').hidden = false; $('#m-ed').textContent = 'Frozen edition · ' + day(L.edition.date); }
  refresh(); layout();
  buildTicks(); buildLegend(); renderPanel();
  addEventListener('resize', resize); resize();
  bindPointer(); bindTools(); bindPhone();
  const h0 = location.hash;
  if (!wide) setMode('layers', true);   // on a phone the map opens as the stack
  const linked = fromHash(h0); addEventListener('hashchange', () => fromHash());
  let seen = false; try { seen = localStorage.getItem('abl-tour') === '1'; } catch (_) {}
  if (!linked && !seen) setTimeout(() => tour(0), 700);
  if (document.fonts) document.fonts.ready.then(() => { sizeCache = {}; });
  requestAnimationFrame(frame);
  if (/[?&]debug\b/.test(location.search)) window.__L = {view, toScreen, home, nodes, cam, select, setSheet, st: () => ({cls: document.body.className, k: +cam.k.toFixed(3), RECT, SB: SB && {BW: Math.round(SB.BW), h: Math.round(SB.height), bands: SB.bands.map(b => [b.id, b.ids.length, Math.round(b.h)]), big: Object.keys(homeStack).map(id => [id, Math.round(size(id).w), Math.round(size(id).h)]).sort((a, b) => b[1] - a[1]).slice(0, 8)}, s: +view().s.toFixed(3), sheet: sheetState, sel, drawer, mode: modeNow(), hash: location.hash})};
}

/* ---------- body shapes and sizes (world units) ---------- */
let sizeCache = {};
const BASE = 15;   // body type size in world units; bodies are sized so their names always fit inside
const MINF = [10.5, 9.5];   // smallest on-screen name size: the map and five layers, then the arranged view
let BS = 1;        // when zoomed far out, bodies grow on screen so names never drop below a readable size
const PLAN = {cake: 1.7, flow: 1.7};   // ...but never past the growth each arranged layout was spaced for, so bodies never collide
function bodyFont(px){ return `600 ${px}px ${SANS}`; }
function wrap(c, text, maxW){
  const words = text.split(' '); if (words.length === 1) return [text];
  let best = [text];
  for (let i = 1; i < words.length; i++){ const a = words.slice(0, i).join(' '), b = words.slice(i).join(' '); if (Math.max(c.measureText(a).width, c.measureText(b).width) < Math.max(...best.map(x => c.measureText(x).width))) best = [a, b]; }
  return c.measureText(text).width <= maxW ? [text] : best;
}
function size(id){
  const e = ents[id], tot = (V.total[id] || 0) / 1e9, key = id + '|' + Math.round(tot) + (wide ? '' : 'p'), P = !wide;   // phones draw compact bodies
  if (sizeCache[key]) return sizeCache[key];
  ctx.font = bodyFont(BASE);
  let s;
  if (e.kind === 'product'){ const w = ctx.measureText(e.name).width + (P ? 26 : 32); s = {shape:'pill', w, h:P ? 32 : 36, r:w / 2}; }
  else if (e.kind === 'instrument'){ const w = Math.max(ctx.measureText(e.name).width + (P ? 40 : 48), P ? 100 : 120); s = {shape:'tag', w, h:P ? 42 : 50, r:w / 2}; }
  else if (e.kind === 'sink'){ const lines = wrap(ctx, e.name, 130), w = Math.max(P ? 128 : 150, ...lines.map(l => ctx.measureText(l).width + (P ? 28 : 34))); const side = Math.max(w, P ? 60 + Math.sqrt(tot) * 1.2 : 80 + Math.sqrt(tot) * 2.4); s = {shape:'sink', w:side, h:Math.max(P ? 64 : 78, side * (P ? 0.5 : 0.62)), r:side / 2, lines}; }
  else if (P){   // phones: a chip with the name and, beside it, the money it touches; more money, a larger chip
    const inv = e.kind !== 'company', lines = ctx.measureText(e.name).width > 200 ? wrap(ctx, e.name, 200) : [e.name], tw = Math.max(...lines.map(l => ctx.measureText(l).width));
    ctx.font = `500 ${BASE * 0.8}px ${MONO}`; const am = V.total[id] ? ctx.measureText(money(V.total[id])).width + 7 : 0;
    const g = Math.min(1, Math.sqrt(tot) / 28), w = tw + am + 26 + (inv ? 8 : 0) + g * 22, h = 32 + (lines.length - 1) * 17 + (inv ? 12 : 0) + g * 16;
    s = {shape: inv ? 'ichip' : 'chip', w, h, r: Math.min(w, h) / 2, lines, am};
  }
  else {
    const lines = wrap(ctx, e.name, 104), tw = Math.max(...lines.map(l => ctx.measureText(l).width));
    const fit = Math.max(tw / 2 + 11, lines.length > 1 ? 36 : 28) + (e.kind === 'investor' || e.kind === 'government' ? 8 : 0);
    const r = Math.min(78, Math.max(fit, 26 + Math.sqrt(tot) * 1.4));
    s = {shape: e.kind === 'investor' || e.kind === 'government' ? 'investor' : 'circle', w:r * 2, h:r * 2, r, lines};
  }
  return sizeCache[key] = s;
}
function inside(id, p, pad){
  const n = nodes[id], s0 = size(id), s = {shape: s0.shape, w: s0.w * BS, h: s0.h * BS, r: s0.r * BS};
  if (s.shape === 'circle' || s.shape === 'investor') return Math.hypot(p.x - n.x, p.y - n.y) < s.r + pad;
  return Math.abs(p.x - n.x) < s.w / 2 + pad && Math.abs(p.y - n.y) < s.h / 2 + pad;
}

/* ---------- arrangements: a mind map from a force layout, and the five-layer stack ---------- */
function hash(s){ let h = 2166136261; for (const c of s) h = Math.imul(h ^ c.charCodeAt(0), 16777619); return ((h >>> 0) % 10000) / 10000; }
// lay bodies along a line in order, zig-zagging across it only as far as needed to fit `avail`.
// along: the line runs down the page, so the amount label under a body adds to its length on the line
function pack(ids, R, U, gap, avail, maxDz, along){
  const n = ids.length; if (!n) return {at: [], dz: 0};
  const run = dz => { const at = []; ids.forEach((id, i) => { let x = 0;
    if (i){ const j = ids[i - 1], need = R(id) + R(j) + gap + (along ? U(j) : 0), v = Math.max(0, 2 * dz - (along ? 0 : Math.max(U(id), U(j))));
      x = at[i - 1] + (dz ? Math.max(0.55 * (R(id) + R(j)), Math.sqrt(Math.max(0, need * need - v * v))) : need); }
    if (i > 1){ const j = ids[i - 2]; x = Math.max(x, at[i - 2] + R(id) + R(j) + gap + (along ? U(j) : 0)); }
    at.push(x); }); return at; };
  let dz = 0, at = run(0);
  const ext = at => at[n - 1] + R(ids[0]) + R(ids[n - 1]) + (along ? U(ids[n - 1]) : 0);
  while (ext(at) > avail && dz < maxDz){ dz += 4; at = run(dz); }
  const lo = -R(ids[0]), span = at[n - 1] + R(ids[n - 1]) + (along ? U(ids[n - 1]) : 0) - lo; return {at: at.map(x => x - lo - span / 2), dz, ok: span <= avail};
}
const availWH = () => [Math.max(320, innerWidth - (innerWidth > 820 ? 376 : 0) - 48), Math.max(260, innerWidth > 820 ? innerHeight - 136 - headTop() : innerHeight * 0.54 - 224)];
function layout(){
  const ids = L.entities.map(e => e.id), E = L.flows.map(f => [f.payer, f.payee, !isMoney(f) ? 130 : f.type === 'capex' ? 420 : 310]);
  const P = {}; ids.forEach(id => { const e = ents[id]; P[id] = {x: (hash(id) - 0.5) * 1100, y: e.layer ? LY[e.layer].y0 * 0.75 : (hash(id + 'y') - 0.5) * 300, vx:0, vy:0}; });
  const rad = id => Math.max(size(id).w, size(id).h) / 2;
  for (let it = 0; it < 900; it++){
    const cool = 1 - it / 900, F = {}; ids.forEach(id => F[id] = {x:0, y:0});
    for (let i = 0; i < ids.length; i++) for (let j = i + 1; j < ids.length; j++){
      const a = P[ids[i]], b = P[ids[j]], dx = a.x - b.x, dy = a.y - b.y, d = Math.hypot(dx, dy) || 0.1, min = rad(ids[i]) + rad(ids[j]) + 110;
      const f = 70000 / (d * d) + (d < min ? (min - d) * 0.6 : 0);
      F[ids[i]].x += dx / d * f; F[ids[i]].y += dy / d * f; F[ids[j]].x -= dx / d * f; F[ids[j]].y -= dy / d * f;
    }
    for (const [u, v, len] of E){ const a = P[u], b = P[v], dx = b.x - a.x, dy = b.y - a.y, d = Math.hypot(dx, dy) || 0.1, f = (d - len) * 0.025; F[u].x += dx / d * f; F[u].y += dy / d * f; F[v].x -= dx / d * f; F[v].y -= dy / d * f; }
    for (const id of ids){
      const e = ents[id], p = P[id];
      if (e.kind === 'sink'){ F[id].y += (560 - p.y) * 0.2; F[id].x -= p.x * 0.05; }
      else if (e.layer) F[id].y += (LY[e.layer].y0 * 1.1 - p.y) * 0.03;
      F[id].x -= p.x * 0.004; F[id].y -= p.y * 0.002;
      const m = Math.hypot(F[id].x, F[id].y), step = Math.min(m, 14 * cool + 0.5);
      if (m > 0){ p.x += F[id].x / m * step; p.y += F[id].y / m * step; }
    }
  }
  homeMap = Object.fromEntries(ids.map(id => [id, {x: P[id].x, y: P[id].y}]));
  // five layers: order each row by where its neighbours sit, a few sweeps of the barycentre heuristic
  const rows = Object.fromEntries(LAYERS.map(l => [l.id, ids.filter(id => ents[id].layer === l.id).sort((a, b) => homeMap[a].x - homeMap[b].x)]));
  const nb = id => L.flows.filter(f => f.payer === id || f.payee === id).map(f => f.payer === id ? f.payee : f.payer);
  const under = (id, k) => ((V.total[id] && ents[id].kind !== 'product' ? 16 : 0) + (V.latest[id] ? 20 : 0)) * k;
  // each row packs its bodies by their real sizes, zig-zagging only as far as it must; each box grows to hold its row
  let ok = true;
  const cake = BSe => {
    const R = id => Math.max(size(id).w, size(id).h) / 2 * BSe, U = id => under(id, BSe), pos = {}, packs = {}; ok = true;
    for (const l of LAYERS){ const r = rows[l.id], p = pack(r, R, U, 26, BOX.w - 190, 160, false); packs[l.id] = p; ok = ok && p.ok;
      l.mU = Math.max(0, ...r.map(U)); l.h = Math.max(168, 2 * p.dz + 2 * Math.max(0, ...r.map(R)) + l.mU + 34); }
    let t = -(LAYERS.reduce((a, l) => a + l.h, 0) + 17 * (LAYERS.length - 1)) / 2;
    for (const l of LAYERS){ l.y = t + l.h / 2; t += l.h + 17; const p = packs[l.id];
      rows[l.id].forEach((id, i) => pos[id] = {x: 65 + p.at[i], y: l.y + 6 - l.mU / 2 + (p.dz ? (i % 2 ? p.dz : -p.dz) : 0)}); }
    return {pos, R, U};
  };
  let pos = cake(1).pos;

      g += `<g class="lp" data-s="${esc(p.s)}" data-c="${esc(cid)}">
        <path d="${up.d}" fill="none" stroke="${ci}" stroke-width="${f1(wi)}" ${p.i ? '' : 'stroke-dasharray="5 5"'} stroke-linecap="round" marker-end="url(#lm${k}-${colors.indexOf(ci)})" data-flowlink="${esc(big(p.inv).id)}"><title>${esc(ents[p.s].name)} → ${esc(e.name)}: ${esc(tin)}</title></path>
        <path d="${dn.d}" fill="none" stroke="${cb}" stroke-width="${f1(wb)}" ${p.b ? '' : 'stroke-dasharray="5 5"'} stroke-linecap="round" marker-end="url(#lm${k}-${colors.indexOf(cb)})" data-flowlink="${esc(big(p.back).id)}"><title>${esc(e.name)} → ${esc(ents[p.s].name)}: ${esc(tback)}</title></path>
        ${cents ? `<rect x="${f1(mc.x - 23)}" y="${f1(mc.y - 11)}" width="46" height="22" rx="11" fill="#fff" stroke="${ink}"/><text class="mono" x="${f1(mc.x)}" y="${f1(mc.y + 4.2)}" text-anchor="middle" font-size="12.5" font-weight="700" fill="${ink}">${cents}</text>` : ''}</g>`;
      // caption outward from the star: name, then money in (supplier's colour of money) and orders back
      const cx = Math.cos(ang), cy = Math.sin(ang), side = Math.abs(cx) > .6, lines = [[ents[p.s].name, ink, 16, 700, ''], [tin, ci, 14, 600, 'mono'], [tback, cb, 14, 600, 'mono']];
      const wd = Math.max(...lines.map(([t, , fs, , m]) => t.length * (m ? fs * .6 : fs * .56))), hgt = 16 + 17 * 2;
      const an = side ? (cx < 0 ? 'end' : 'start') : 'middle', tx = side ? S.x + (rs + 9) * Math.sign(cx) : S.x;
      const ty0 = side ? S.y - hgt / 2 + 12 : cy < 0 ? S.y - rs - 10 - (hgt - 14) : S.y + rs + 18;
      const lx0 = an === 'end' ? tx - wd : an === 'start' ? tx : tx - wd / 2;
      grow(Math.min(S.x - rs, lx0), Math.min(S.y - rs, ty0 - 15), Math.max(S.x + rs, lx0 + wd), Math.max(S.y + rs, ty0 + hgt - 10));
      nodes += `<g class="nd" data-node="${esc(p.s)}" data-entlink="${esc(p.s)}"><circle cx="${f1(S.x)}" cy="${f1(S.y)}" r="${f1(rs)}" fill="${tint(ents[p.s])}" stroke="${ink}" stroke-width="1.4"/>
        ${lines.map(([t, col, fs, fw, m], j) => `<text class="lbl ${m}" x="${f1(tx)}" y="${f1(ty0 + (j ? 16 + (j - 1) * 17 + 2 : 0))}" text-anchor="${an}" font-size="${fs}" font-weight="${fw}" fill="${col}">${esc(t)}</text>`).join('')}</g>`;
    });
    const fsC = rc > 36 ? 15 : 13, inside = e.name.length * fsC * .56 < rc * 1.8, cyT = inside ? C.y + 5 : C.y + rc + 18;
    if (!inside) grow(C.x - e.name.length * fsC * .3, C.y, C.x + e.name.length * fsC * .3, cyT + 4);
    nodes += `<g class="nd" data-node="${esc(cid)}" data-entlink="${esc(cid)}"><circle cx="${C.x}" cy="${C.y}" r="${f1(rc)}" fill="${tint(e)}" stroke="${ink}" stroke-width="1.6"/>
      <text class="lbl" x="${C.x}" y="${cyT}" text-anchor="middle" font-size="${fsC}" font-weight="700" fill="${ink}">${esc(e.name)}</text></g>`;
    return `<figure class="lstar"><figcaption><b>${esc(e.name)}</b> · ${n} supplier${n > 1 ? 's' : ''} in a loop with it<span>${ti ? money(ti) : '–'} in from them · ${tb ? money(tb) : '–'} committed back</span></figcaption>
      <svg class="lm" viewBox="${bx.map((v, j) => f1(j < 2 ? v - 8 : v - bx[j - 2] + 16)).join(' ')}" style="width:${Math.round((bx[2] - bx[0] + 16) * .8)}px" role="img" aria-label="${esc(e.name)} and the suppliers that fund it and sell to it">
      <defs>${colors.map((c, j) => `<marker id="lm${k}-${j}" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="10" markerHeight="10" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="${c}"/></marker>`).join('')}</defs>
      ${g}${nodes}</svg></figure>`;
  };
  const strip = lp.map(x => `<button class="lchip" data-node="${esc(x.s)}" data-entlink="${esc(x.s)}"><b>${esc(ents[x.s].name)}</b> ${x.cents != null ? `<span class="c">${x.cents}¢</span>` : ''}<span>${x.i ? money(x.i) : '–'} in · ${x.b ? money(x.b) : '–'} back</span></button>`).join('');
  return `${wide ? `<div class="lstrip"><span class="k">Suppliers, by orders back</span>${strip}</div>` : `<div class="lstrip-k">Suppliers, by orders back</div><div class="lstrip">${strip}</div>`}<div class="lgrid">${cus.map(star).join('')}</div>`;
}
function hookLoopMap(){
  const box = $('#drawer .lmbox'); if (!box) return;
  const clear = () => { box.classList.remove('hot'); box.querySelectorAll('.on').forEach(x => x.classList.remove('on')); };
  box.addEventListener('mouseover', e => { const nd = e.target.closest('[data-node]'), lp = e.target.closest('.lp'); clear(); if (!nd && !lp) return;
    box.classList.add('hot');
    if (lp){ lp.classList.add('on'); box.querySelectorAll(`[data-node="${lp.dataset.s}"], [data-node="${lp.dataset.c}"]`).forEach(x => x.classList.add('on')); return; }
    const id = nd.dataset.node; box.querySelectorAll(`[data-node="${id}"]`).forEach(x => x.classList.add('on'));
    box.querySelectorAll('.lp').forEach(l => { if (l.dataset.s === id || l.dataset.c === id){ l.classList.add('on'); box.querySelectorAll(`.lm [data-node="${l.dataset.c}"], .lm [data-node="${l.dataset.s}"]`).forEach(x => { if (x.closest('figure') === l.closest('figure')) x.classList.add('on'); }); } }); });
  box.addEventListener('mouseleave', clear);
}
function renderDrawer(){
  drawDrawer();
  if (!wide) $('#drawer-body').querySelectorAll('table').forEach(t => { if (t.parentNode.classList.contains('tscroll')) return; const w = document.createElement('div'); w.className = 'tscroll'; t.replaceWith(w); w.appendChild(t); });
}
function dealsCards(D){

             ann: f => f.grade !== 'reported' && f.status !== 'cash_moved' && f.status !== 'contracted', press: f => f.grade === 'reported'};
  const NM = [['all', 'All'], ['moved', 'Money moved'], ['signed', 'Signed'], ['ann', 'Announced'], ['press', 'Press only']];
  const list = money_.filter(F[dealF]).sort((a, b) => (b.amount_usd || 0) - (a.amount_usd || 0) || (a.date < b.date ? 1 : -1));
  const card = f => `<button class="card" data-flowlink="${esc(f.id)}"><div class="c1"><span class="who"><b>${esc(ents[f.payer].name)}</b> → <b>${esc(ents[f.payee].name)}</b></span><span class="amt" style="color:${f.amount_usd ? COL[f.type] : css('--muted')}">${f.amount_usd ? money(f.amount_usd) : 'n/d'}</span></div>
    <div class="c2">${esc(f.title || f.label || TYPE[f.type])}</div>
    <div class="c3"><span><span class="ln" style="border-color:${COL[f.type]};border-top-style:${f.status === 'cash_moved' ? 'solid' : 'dashed'}"></span>${esc(TYPE[f.type])} · ${esc(STATUS[f.status])}</span>${chip(f.grade)}${PENDING.has(f.id) ? '<span class="chip unchecked">unchecked</span>' : ''}<span class="num">${day(f.date)}</span></div></button>`;
  const sec = (title, n, body) => n ? `<details class="dsec"><summary>${title} (${n})</summary><div class="mlist">${body}</div></details>` : '';
  D.innerHTML = `<h2>Every deal</h2><p class="note">${money_.length} money rows public by ${day(iso())}, largest first. Tap one for what its source says.</p>
    <div class="dchips">${NM.map(([k, t]) => `<button data-dealf="${k}" aria-pressed="${dealF === k}">${t}<span>${money_.filter(F[k]).length}</span></button>`).join('')}</div>
    <div class="cards">${list.map(card).join('') || '<p class="note">No rows in this group at this date.</p>'}</div>
    ${sec('Product and usage links', links.length, links.map(f => `<div class="row"><div class="t"><span><b>${esc(ents[f.payer].name)}</b> → <b>${esc(ents[f.payee].name)}</b></span></div><div class="m">${esc(TYPE[f.type])} · ${src(f)}</div></div>`).join(''))}
    ${sec('Model releases', V.rel.length, V.rel.slice().reverse().map(r => `<div class="row"><div class="t"><span><b>${esc(r.model)}</b></span><span class="num">${day(r.date)}</span></div><div class="m">${esc(ents[r.entity].name)} · ${esc(r.access)}${r.price_in != null ? ' · $' + r.price_in + ' / $' + r.price_out : ''} ${chip(r.grade)} ${src(r)}</div></div>`).join(''))}
    ${sec('Stated revenue and usage', V.met.length, V.met.map(m => `<div class="row"><div class="t"><span><b>${esc(ents[m.entity].name)}</b> · ${esc(MET[m.metric] || m.metric)}</span><span class="num">${esc(mval(m))}</span></div><div class="m">as of <span class="num">${day(m.as_of)}</span> ${chip(m.grade)} ${src(m)}</div></div>`).join(''))}
    ${sec('Filed observations', V.obs.length, V.obs.map(o => `<div class="row"><div class="t"><span><b>${esc(ents[o.subject].name)}</b> · ${esc(o.metric)}</span><span class="num">${money(o.value_usd)}</span></div><div class="m">period ending <span class="num">${day(o.period_end)}</span>${o.derived ? ' · derived' : ''} · <a href="${esc(o.source_url)}" target="_blank" rel="noopener">${esc(o.accn)}</a></div></div>`).join(''))}
    ${sec('Events', V.events.length, V.events.slice().reverse().map(e => `<div class="row"><div class="t"><span><b>${esc(e.title)}</b></span></div><div class="m"><span class="num">${day(e.date)}</span> ${chip(e.grade)} ${src(e)}</div></div>`).join(''))}`;
}
function drawDrawer(){
  const D = $('#drawer-body');

  if (drawer === 'loops'){
    const lp = loops(), name = id => esc(ents[id].name), link = f => `<button class="num" data-flowlink="${esc(f.id)}" style="color:inherit;text-decoration:underline">${isMoney(f) ? money(f.amount_usd) : 'stake'}</button>`;
    const tabs = `<span class="seg" role="group" aria-label="Loops view"><button data-ltab="map" aria-pressed="${loopTab === 'map'}">Map</button><button data-ltab="table" aria-pressed="${loopTab === 'table'}">Table</button></span>`;

      D.innerHTML = `<h2 style="display:inline-block">Loops</h2>${tabs}<p class="note">${wide ? `One star per customer, with the suppliers that both fund it and sell to it around it, as of ${day(iso())}. On each spoke, one curve is the supplier's money in and the other is the customer's orders back, so every spoke is a closed loop. Thicker means more dollars; dashed means not disclosed. The badge is cents in per $1 back. Hover a supplier to see every customer it loops with; click a curve for its row.` : `Suppliers that fund a customer which commits money straight back to them, as of ${day(iso())}. On each spoke one curve is money in, the other is orders back; the badge is cents in per $1 back. Tap a supplier to light up its loops, or a curve for its row.`}</p><div class="lmbox">${loopMap(lp)}</div>
      <h3>How to read it</h3><p class="def">Blue is equity, purple is loans or backstops, grey is an ownership stake with no new money in the window; orange is purchase commitments. Amounts are gross and summed per pair. A badge appears only where both sides are disclosed, so a missing badge is not a zero.</p>`;
      hookLoopMap(); return;
    }
    D.innerHTML = `<h2 style="display:inline-block">Loops</h2>${tabs}<p class="note">A loop is a supplier putting its own money into a customer that has also committed money back to it: equity, loans or backstops one way, purchase commitments the other. Only rows on this ledger count, as of ${day(iso())}. Amounts are gross and undisclosed amounts are left out, so a blank is not a zero.</p>
      <table><tr><th>Supplier</th><th>Customers it funds that also buy from it</th><th class="r">Its money in</th><th class="r">Orders back</th><th class="r">Cents in per $1 back*</th></tr>
      ${lp.map(x => `<tr><td><button data-entlink="${esc(x.s)}"><b>${name(x.s)}</b></button></td><td>${x.ls.map(l => `<div><button data-entlink="${esc(l.c)}">${name(l.c)}</button>: ${l.inv.map(link).join(' + ')} in, ${l.back.map(link).join(' + ')} back</div>`).join('')}</td><td class="r num">${x.i ? money(x.i) : '–'}</td><td class="r num">${x.b ? money(x.b) : '–'}</td><td class="r num">${x.cents != null ? x.cents + '¢' : '–'}</td></tr>`).join('')}</table>
      <p class="note">* Counted only over customers where both sides are disclosed. "Stake" is an ownership stake with no new money inside the ledger's window, such as Microsoft's holding in OpenAI, which it bought before July 2025.</p>
      <h3>Precedent: telecom, 1999 to 2001</h3><p class="def">At the end of its 2000 fiscal year, Lucent had committed to lend up to about $6.7B to its own customers and to guarantee up to about $1.4B more of their debt, against $33.8B of revenue that year. <a href="https://www.sec.gov/Archives/edgar/data/1006240/000095012300011855/y43690e10-k405.txt" target="_blank" rel="noopener">Lucent 10-K, fiscal 2000</a>. That was credit to buy Lucent's own gear. Most of today's loops are equity stakes set against long compute contracts, so the two are not measured the same way: the table above compares a supplier's money in with the orders coming back, not with its revenue.</p>
      <h3>What the table leaves out</h3><p class="def">Loops where only one side is on the ledger, such as Nvidia's stakes in CoreWeave and Nebius, whose GPU purchases from Nvidia are not disclosed as rows. They join the table as soon as both sides are sourced.</p>`;
    return;
  }

    const money_ = V.flows.filter(isMoney), links = V.flows.filter(f => !isMoney(f));
    D.innerHTML = `<h2>The ledger</h2><p class="note">The map draws nothing that is not listed here. Rows public on or before ${day(iso())}.</p>
      <h3>Money flows (${money_.length})</h3><table><tr><th>Payer</th><th>Payee</th><th>Type</th><th>Status</th><th class="r">Amount</th><th>Term</th><th>Grade</th><th>As of</th><th>Source</th></tr>
      ${money_.map(f => `<tr><td>${esc(ents[f.payer].name)}</td><td>${esc(ents[f.payee].name)}</td><td>${esc(TYPE[f.type])}</td><td>${esc(STATUS[f.status])}</td><td class="r num">${money(f.amount_usd)}</td><td class="num">${termYears(f) ? termYears(f) + ' yrs' : ''}</td><td>${chip(f.grade)}${PENDING.has(f.id) ? ' <span class="chip unchecked">unchecked</span>' : ''}</td><td class="num">${day(f.as_of)}</td><td>${src(f)}</td></tr>`).join('')}</table>
      <h3>Product and usage links (${links.length})</h3><table><tr><th>From</th><th>To</th><th>Link</th><th>Source</th></tr>
      ${links.map(f => `<tr><td>${esc(ents[f.payer].name)}</td><td>${esc(ents[f.payee].name)}</td><td>${esc(TYPE[f.type])}</td><td>${src(f)}</td></tr>`).join('')}</table>
      <h3>Filed observations (${V.obs.length})</h3><table><tr><th>Entity</th><th>Metric</th><th>Period end</th><th class="r">Value</th><th>Derived</th><th>Filed</th><th>Accession</th></tr>
      ${V.obs.map(o => `<tr><td>${esc(ents[o.subject].name)}</td><td>${esc(o.metric)}</td><td class="num">${day(o.period_end)}</td><td class="r num">${money(o.value_usd)}</td><td>${o.derived ? 'yes' : ''}</td><td class="num">${day(o.available)}</td><td class="num"><a href="${esc(o.source_url)}" target="_blank" rel="noopener">${esc(o.accn)}</a></td></tr>`).join('')}</table>
      <h3>Model releases (${V.rel.length})</h3><table><tr><th>Date</th><th>Product</th><th>Model</th><th>Access</th><th>Open</th><th class="r">Price in / out</th><th>Grade</th><th>Source</th></tr>
      ${V.rel.slice().reverse().map(r => `<tr><td class="num">${day(r.date)}</td><td>${esc(ents[r.entity].name)}</td><td>${esc(r.model)}${r.material ? ' <span class="tag">structural</span>' : ''}</td><td>${esc(r.access)}</td><td>${r.open_weights ? 'yes' : ''}</td><td class="r num">${r.price_in != null ? '$' + r.price_in + ' / $' + r.price_out : ''}</td><td>${chip(r.grade)}</td><td>${src(r)}</td></tr>`).join('')}</table>
      <h3>Stated revenue and usage (${V.met.length})</h3><table><tr><th>Entity</th><th>Metric</th><th>As of</th><th class="r">Value</th><th>Published</th><th>Grade</th><th>Source</th></tr>
      ${V.met.map(m => `<tr><td>${esc(ents[m.entity].name)}</td><td>${esc(MET[m.metric] || m.metric)}</td><td class="num">${day(m.as_of)}</td><td class="r num">${esc(mval(m))}</td><td class="num">${day(m.available)}</td><td>${chip(m.grade)}</td><td>${src(m)}</td></tr>`).join('')}</table>
      <h3>Events (${V.events.length})</h3><table><tr><th>Date</th><th>Level</th><th>Event</th><th>Grade</th><th>Source</th></tr>
      ${V.events.slice().reverse().map(e => `<tr><td class="num">${day(e.date)}</td><td>${esc(e.level)}</td><td>${esc(e.title)}</td><td>${chip(e.grade)}</td><td>${src(e)}</td></tr>`).join('')}</table>`;
  } else {
    const bt = L.backtest, vf = L.verification, run = L.runs[L.runs.length - 1];
    D.innerHTML = `<h2>Checks</h2><p class="note">Latest run ${esc(run.id)}, ledger as of ${day(L.as_of)}. These results come from the run, not from the page.</p>
      <h3>Reconciliation against filings (${L.checks.filter(c => c.pass).length} of ${L.checks.length} pass)</h3>
      <table><tr><th>Entity</th><th>Metric</th><th>Period end</th><th>Test</th><th class="r">Difference</th><th></th></tr>${L.checks.map(c => `<tr><td>${esc(ents[c.subject].name)}</td><td>${esc(c.metric)}</td><td class="num">${day(c.period_end)}</td><td>${CHECK[c.check] || c.check}${c.basis ? ` <a href="${esc(c.source_url)}" target="_blank" rel="noopener">${esc(c.basis)}</a>` : ''}</td><td class="r num">${c.check === 'yoy_pct' ? c.abs_diff.toFixed(2) + ' pts' : '$' + (c.abs_diff / 1e6).toFixed(0) + 'M'}</td><td class="${c.pass ? 'pass' : 'fail'}">${c.pass ? 'pass' : 'FAIL'}</td></tr>`).join('')}</table>
      <h3>Where trackers disagree</h3>${(L.ranges || []).map(r => `<p class="def"><b>${esc(ents[r.subject].name)} ${esc(r.metric)}, period ending ${day(r.period_end)}:</b> ${r.values.map(v => `${money(v.value_usd)} ${chip(v.grade)} <a href="${esc(v.source_url)}" target="_blank" rel="noopener">${esc(v.basis)}</a>`).join(' vs ')}</p>`).join('')}
      <h3>Backtest: ledger as of ${day(bt.from)}, then run to ${day(bt.to)}</h3><p class="note">${bt.rows_at_from} rows before, ${bt.rows_at_to} after. Known events come from independent press, listed before the run.</p>
      <table><tr><th>Date</th><th>Known event</th><th>Result</th><th>Caught by</th></tr>${bt.known_events.map(k => `<tr><td class="num">${day(k.date)}</td><td><a href="${esc(k.independent_source)}" target="_blank" rel="noopener">${esc(k.what)}</a></td><td class="${k.caught ? (k.grade === 'filed' ? 'pass' : 'warn') : 'fail'}">${k.caught ? (k.grade === 'filed' ? 'caught from a filing' : 'caught from press only') : 'MISSED'}</td><td class="num">${esc(k.by_row || '')}</td></tr>`).join('')}</table>
      <h3>Independent verification</h3>${vf && (vf.pending || []).length ? `<p class="def warn">${vf.pending.length} rows added in the latest pass are still being checked by the verifier. Treat them as unverified until this line goes away.</p>` : ''}${vf ? `<p class="def">${esc(vf.method)} ${vf.rows_checked} rows checked on ${esc(vf.verified_at)}; ${vf.confirmed.length} confirmed, ${vf.findings.length} findings.</p>${vf.findings.length ? `<table><tr><th>Row</th><th>Finding</th><th>Note</th><th>Now</th></tr>${vf.findings.map(f => { const done = (vf.addressed || []).includes(f.row); return `<tr><td class="num">${esc(f.row)}</td><td class="${f.severity === 'wrong' ? 'fail' : 'warn'}">${esc(f.severity)}</td><td>${esc(f.note)}</td><td class="${done ? 'pass' : 'warn'}">${done ? 'corrected' : 'open'}</td></tr>`; }).join('')}</table>` : ''}` : '<p class="def warn">Not yet attached to this run.</p>'}
      <h3>Cross-check against other maps (${(L.coverage || []).filter(c => c.caught).length} of ${(L.coverage || []).length} edges on the ledger${(L.coverage || []).some(c => c.excluded) ? `, ${(L.coverage || []).filter(c => c.excluded).length} left off on purpose` : ''})</h3>
      <p class="note">Connections that other published maps of AI deals draw. Each run checks whether this ledger has a sourced row for each one; a missing edge is a target for the next run, not a fact.</p>
      <table><tr><th>Connection</th><th>Shown in</th><th>Ledger</th></tr>${(L.coverage || []).map(c => `<tr><td>${esc(ents[c.a] ? ents[c.a].name : c.a)} – ${esc(ents[c.b] ? ents[c.b].name : c.b)}<div class="note">${esc(c.what)}</div></td><td>${c.maps.map(m => `<a href="${esc(m.url)}" target="_blank" rel="noopener">${esc(m.name)}</a>`).join('<br>')}</td><td class="${c.caught || c.excluded ? 'pass' : 'warn'}">${c.caught ? c.rows.map(r => `<button class="num" data-flowlink="${esc(r)}" style="color:inherit;text-decoration:underline">${esc(r)}</button>`).join(' ') : c.excluded ? esc(c.reason) : 'missing: ' + esc(c.reason)}</td></tr>`).join('')}</table>
      <h3>Not sourced from primary material</h3>${(L.gaps || []).map(g => `<p class="def"><b>${esc(g.topic)}.</b> ${esc(g.note)}</p>`).join('')}
      <h3>Corrections (${L.corrections.length})</h3><p class="def">${L.corrections.length ? L.corrections.map(c => `<span class="num">${day(c.date)}</span> · ${esc(c.rows.join(', '))}: ${esc(c.note)}`).join('<br>') + '<br><br>' : 'None logged. '}To flag an error, name the row and the source that contradicts it. Each run checks flagged rows, and any change is logged here.</p>`;
  }
}
