<style>
:root{
  /* One visual world: ink on paper. Colour belongs to money; bodies stay neutral and carry their layer as a pale tint.
     Layout: full-bleed board, header top-left, reading panel right, time along the bottom. */
  color-scheme: light;
  --paper:#F6F5F1; --paper-2:#EFEDE7; --card:#FFFFFF; --line:#DEDBD3; --line-2:#C8C4BA;
  --ink:#16171B; --ink-2:#3B3E46; --muted:#6C717D; --dim:#9AA0AA;
  --equity:#1F5BD6; --commit:#E0561C; --capex:#12865A; --debt:#8A3EC8; --link:#8E939C;
  --t-distribution:#FBE7EE; --t-instruments:#E6EDFB; --t-issuance:#E2F2E9; --t-ledgers:#FCEEDC; --t-reserves:#F7F0D3; --t-capital:#EDEBE6;
  --ok:#1E7F4C; --warn:#A86A12; --bad:#BF3A2B; --release:#C0266D;
  --sans:"Anthropic Sans","Hanken Grotesk",system-ui,-apple-system,"Segoe UI",sans-serif;
  --mono:"Anthropic Mono","JetBrains Mono",ui-monospace,Menlo,Consolas,monospace;
}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:var(--paper);color:var(--ink);font:14px/1.45 var(--sans);overflow:hidden;-webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
a{color:var(--equity);text-underline-offset:2px}
:focus-visible{outline:2px solid var(--equity);outline-offset:2px;border-radius:4px}
.num{font-family:var(--mono);font-variant-numeric:tabular-nums}
#stage{position:fixed;inset:0;display:block;width:100%;height:100%;touch-action:none}
#stage.drag{cursor:grabbing !important}
#msg{position:fixed;inset:0;display:grid;place-items:center;color:var(--muted);padding:24px;text-align:center}

header{position:fixed;left:24px;top:18px;max-width:min(620px,calc(100vw - 940px));min-width:min(420px,calc(100vw - 420px));pointer-events:none}
h1{font:700 30px/1.05 var(--sans);letter-spacing:-.02em;margin:0 0 6px;text-wrap:balance}
.sub{color:var(--ink-2);margin:0 0 12px;font-size:13.5px;max-width:52ch}
.stats{display:flex;flex-wrap:wrap;gap:6px 22px}
.stat b{display:block;font:600 18px var(--mono);font-variant-numeric:tabular-nums;letter-spacing:-.01em}
.stat span{color:var(--muted);font-size:11.5px}
.stat.total{flex-basis:100%}
.split{display:flex;height:8px;border-radius:2px;overflow:hidden;margin:6px 0 5px;max-width:440px;background:var(--paper-2)}
.split i{display:block;min-width:2px}
.s-moved{background:var(--ink)} .s-signed{background:#646872} .s-ann{background:#B9BDC5} .s-press{background:repeating-linear-gradient(135deg,var(--warn) 0 2px,#F3E6D2 2px 5px)}
.skey{display:flex;flex-wrap:wrap;gap:2px 12px;font-size:11.5px;color:var(--ink-2);max-width:560px}
.skey i{display:inline-block;width:9px;height:9px;border-radius:2px;margin-right:4px;vertical-align:-1px}
.skey .gross{color:var(--muted);flex-basis:100%}
.mini{display:none;font-size:11.5px;color:var(--muted);line-height:1.45;flex-basis:100%}
.mini b{font:600 12.5px var(--mono);color:var(--ink)}
@media (min-width:821px) and (max-width:1560px){ .stat:not(.total){display:none} .mini{display:block} .sub{margin-bottom:8px} }
.show{display:flex;flex-wrap:wrap;gap:4px;align-items:center;align-self:flex-end;pointer-events:auto;font-size:11.5px;color:var(--muted)}
.show button{border:1px solid var(--line-2);border-radius:999px;padding:2px 9px;background:#ffffffd9;font-size:11.5px;color:var(--ink-2)}
.show button[aria-pressed="true"]{background:var(--ink);color:var(--paper);border-color:var(--ink)}
#find{border:1px solid var(--line-2);background:#ffffffd9;border-radius:999px;padding:6px 12px;font:500 12.5px var(--sans);width:150px;color:var(--ink)}
#find:focus{outline:2px solid var(--equity);outline-offset:1px}
.seg{display:inline-flex;gap:4px;margin:2px 0 6px}
.seg button{border:1px solid var(--line-2);border-radius:999px;padding:3px 10px;font-size:12px}
.seg button[aria-pressed="true"]{background:var(--ink);color:var(--paper);border-color:var(--ink)}
.chip.unchecked{border-style:dotted;color:var(--ink-2)}
#tour{position:fixed;left:24px;bottom:124px;width:350px;background:var(--card);border:1px solid var(--ink);border-radius:12px;padding:12px 14px 12px;box-shadow:0 10px 28px #0000002a;z-index:6}
#edition{display:block;margin:0 0 8px;font:600 11px var(--mono);letter-spacing:.06em;text-transform:uppercase;color:var(--ink);pointer-events:auto}
#edition a{color:inherit}
#tour p{margin:6px 0 10px;font-size:13.5px;color:var(--ink-2)}
#tour .acts{display:flex;justify-content:flex-end;gap:6px}
#tour .acts .on{background:var(--ink);color:var(--paper);border-color:var(--ink)}

.tools{position:fixed;right:392px;top:16px;display:flex;gap:6px;flex-wrap:wrap;justify-content:flex-end;max-width:520px}
.btn{border:1px solid var(--line-2);background:#ffffffd9;border-radius:999px;padding:6px 12px;font-size:12.5px;font-weight:500;backdrop-filter:blur(6px)}
.btn:hover{border-color:var(--ink-2)}
.btn[aria-pressed="true"]{background:var(--ink);color:var(--paper);border-color:var(--ink)}
.btn[disabled]{opacity:.5;cursor:not-allowed}

#sheet{position:fixed;right:0;top:0;bottom:0;width:376px;background:var(--card);border-left:1px solid var(--line);display:flex;flex-direction:column}
#panel{flex:1;min-height:0;overflow:auto;padding:20px 20px 110px}
#sab{position:fixed;bottom:0;left:0;width:0;height:env(safe-area-inset-bottom);visibility:hidden;pointer-events:none}
aside h2{font:700 24px/1.1 var(--sans);letter-spacing:-.015em;margin:2px 0 4px;text-wrap:balance}

.kicker{font:500 11px var(--mono);color:var(--muted);letter-spacing:.06em;text-transform:uppercase}
.back{font-size:12.5px;color:var(--muted);padding:0 0 10px}
.back:hover{color:var(--ink)}
.note{color:var(--ink-2);font-size:12.8px;margin:6px 0 0}
.row{display:block;width:100%;text-align:left;border-top:1px solid var(--line);padding:9px 0}
button.row:hover{background:var(--paper)}
.row .t{display:flex;gap:8px;align-items:baseline;justify-content:space-between}
.row .t b{font-weight:600}
.row .m{color:var(--muted);font-size:12px;margin-top:2px}
.row .amt{font:600 13px var(--mono);white-space:nowrap}
.chip{display:inline-block;font:600 9.5px var(--mono);letter-spacing:.05em;text-transform:uppercase;border-radius:3px;padding:1px 5px;border:1px solid var(--line-2);color:var(--muted);vertical-align:1px}
.chip.filed{background:var(--ink);color:var(--paper);border-color:var(--ink)}
.chip.onchain{background:var(--capex);color:#fff;border-color:var(--capex)}
.chip.attested{background:var(--ink-2);color:var(--paper);border-color:var(--ink-2)}
.chip.announced{border-color:var(--ink);color:var(--ink)}
.chip.reported{border-style:dashed;color:var(--warn);border-color:var(--warn)}
.sw{display:inline-block;width:18px;height:0;border-top:3px solid;vertical-align:middle;margin-right:6px;border-radius:2px}
.ents{display:flex;flex-wrap:wrap;gap:6px}
.ents .btn{background:var(--card)}
.grp{margin:8px 0 2px;font:600 10px var(--mono);letter-spacing:.08em;text-transform:uppercase;color:var(--dim)}
.bars{display:flex;align-items:flex-end;gap:4px;height:70px;margin-top:6px}
.bars i{flex:1;background:#BFD9CB;border-radius:2px 2px 0 0;min-height:2px}
.bars i.d{background:repeating-linear-gradient(135deg,#BFD9CB 0 3px,#E7F1EB 3px 6px)}
.bars i.last{background:var(--capex)}
.axis{display:flex;justify-content:space-between;color:var(--dim);font:11px var(--mono);margin-top:3px}
.def{color:var(--ink-2);font-size:12.5px;margin:4px 0 0}

#time{position:fixed;left:24px;right:400px;bottom:14px;background:#ffffffe6;border:1px solid var(--line);border-radius:12px;padding:9px 14px 8px;backdrop-filter:blur(8px)}
.trow{display:flex;align-items:center;gap:12px}
#play{border:1px solid var(--line-2);border-radius:999px;width:32px;height:32px;flex:none;font-size:11px;background:var(--card)}
#asof{font:600 13px var(--mono);min-width:104px}
.track{position:relative;flex:1;height:32px}
.track input{position:absolute;inset:0;width:100%;margin:0;appearance:none;-webkit-appearance:none;background:transparent;height:32px}
.track input::-webkit-slider-runnable-track{height:2px;background:var(--line-2)}
.track input::-moz-range-track{height:2px;background:var(--line-2)}
.track input::-webkit-slider-thumb{-webkit-appearance:none;width:14px;height:22px;border-radius:3px;background:var(--ink);margin-top:-10px;border:0}
.track input::-moz-range-thumb{width:14px;height:22px;border-radius:3px;background:var(--ink);border:0}
.ticks{position:absolute;left:7px;right:7px;top:0;height:32px;pointer-events:none}
.ticks i{position:absolute;top:6px;width:2px;height:8px;background:var(--ink-2);border-radius:1px}
.ticks i.reported{background:var(--warn)}
.ticks i.rel{background:var(--release);width:3px;top:3px;height:12px}
.rel-row .m b{color:var(--ink-2);font-weight:600}
.tag{display:inline-block;font:600 9.5px var(--mono);letter-spacing:.04em;text-transform:uppercase;border-radius:3px;padding:1px 5px;color:var(--release);border:1px solid var(--release);vertical-align:1px}
.mchart{width:100%;height:96px;display:block;margin-top:6px;overflow:visible}
.mchart text{font:10px var(--mono);fill:var(--muted)}
.latest td{padding:5px 6px 5px 0;vertical-align:top}
.latest button{color:var(--ink);font-weight:600;text-align:left}
.ticks span{position:absolute;bottom:-3px;font:10.5px var(--mono);color:var(--dim);transform:translateX(-50%)}
.legend{display:flex;flex-wrap:wrap;gap:4px 14px;color:var(--ink-2);font-size:11.5px;margin-top:6px;align-items:center}
.legend svg{vertical-align:middle;margin-right:5px}
.legend .sep{width:1px;height:14px;background:var(--line-2)}

#drawer{position:fixed;left:24px;right:400px;top:150px;bottom:112px;background:var(--card);border:1px solid var(--line-2);border-radius:12px;overflow:auto;padding:16px 18px;display:none;box-shadow:0 10px 30px #0000001a}
#drawer.open{display:block}
#d-close{position:sticky;top:0;float:right;margin:-6px -8px 0 8px;width:30px;height:30px;border-radius:50%;border:1px solid var(--line-2);background:#fff;font-size:18px;line-height:1;color:var(--ink-2);z-index:2}
#drawer h2{font:700 22px var(--sans);margin:0 0 4px}
.seg{display:inline-flex;gap:4px;margin:2px 0 0 10px;vertical-align:4px}
.seg button{border:1px solid var(--line-2);border-radius:999px;padding:2px 10px;background:#fff;font-size:12px;color:var(--ink-2)}
.seg button[aria-pressed="true"]{background:var(--ink);color:var(--paper);border-color:var(--ink)}
.lstrip{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin:10px 0 4px}
.lstrip .k{font:600 10.5px var(--mono);letter-spacing:.06em;text-transform:uppercase;color:var(--muted);margin-right:4px}
.lchip{border:1px solid var(--line-2);border-radius:999px;padding:3px 10px;background:#fff;font-size:12px;color:var(--ink-2);display:inline-flex;gap:6px;align-items:baseline}
.lchip .c{font:700 12px var(--mono);color:var(--ink)} .lchip span:last-child{font:11px var(--mono);color:var(--muted)}
.lgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(340px,1fr));gap:12px;margin-top:8px;align-items:start}
@media (max-width:820px){.lgrid{grid-template-columns:1fr}}
.lstar{margin:0;border:1px solid var(--line);border-radius:10px;padding:8px 8px 2px;background:var(--paper)}
.lstar figcaption{font-size:13px;color:var(--ink-2);padding:2px 4px} .lstar figcaption span{display:block;font:11px var(--mono);color:var(--muted);margin-top:2px}
.lm{display:block;max-width:100%;height:auto;margin:0 auto}
.lmbox.hot .lchip{opacity:.4} .lmbox.hot .lchip.on{opacity:1;border-color:var(--ink)}
.lm text{font-family:var(--sans)} .lm .mono{font-family:var(--mono)}
.lm .lbl{paint-order:stroke;stroke:#fff;stroke-width:4px;stroke-linejoin:round}
.lm .lp{transition:opacity .15s} .lmbox.hot .lp{opacity:.12} .lmbox.hot .lp.on{opacity:1}
.lm .nd{cursor:pointer} .lm path[data-flowlink]{cursor:pointer}
.lmbox.hot .nd{opacity:.3} .lmbox.hot .nd.on{opacity:1}
#drawer h3{font:600 11px var(--mono);letter-spacing:.08em;text-transform:uppercase;color:var(--muted);margin:18px 0 6px}
table{border-collapse:collapse;width:100%;font-size:12.5px}
th{text-align:left;color:var(--muted);font-weight:600;border-bottom:1px solid var(--line-2);padding:5px 8px 5px 0;position:sticky;top:-16px;background:var(--card)}
td{border-bottom:1px solid var(--line);padding:5px 8px 5px 0;vertical-align:top}
td.r,th.r{text-align:right}
.pass{color:var(--ok)} .fail{color:var(--bad)} .warn{color:var(--warn)}

#tw{display:block;width:100%;margin:6px 0 4px;touch-action:pan-y;cursor:pointer;-webkit-user-select:none;user-select:none}
.twbar{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin:8px 0 0}
.twbar .k{font:600 10.5px var(--mono);letter-spacing:.06em;text-transform:uppercase;color:var(--muted);margin-right:2px}
.twbar button{border:1px solid var(--line-2);border-radius:999px;padding:5px 11px;background:#fff;font-size:12.5px;color:var(--ink-2)}
.twbar button[aria-pressed="true"]{background:var(--ink);color:var(--paper);border-color:var(--ink)}
.twbar button.ghost{border-style:dashed}
.twlead{font-size:15px;margin:6px 0 2px}
.lnk{text-decoration:underline;color:inherit;padding:0;font:inherit}
body.phone .twbar button{padding:7px 12px;font-size:13px}
/* ---------- phones: a top bar with three tabs, the map as a vertical stack, details in a bottom sheet ---------- */
#mbar,#mmenu,#msearch,#m-fit,#grab,#mscrim,.ph-only{display:none}
body.phone .ph-only,body.land .ph-only{display:block}
body.phone .desk-only,body.land .desk-only{display:none}
body.phone header,body.land header,body.phone .tools,body.land .tools{display:none}
body.phone,body.land{-webkit-text-size-adjust:100%}
body.phone button,body.land button{touch-action:manipulation;-webkit-tap-highlight-color:transparent}
body.phone #mbar,body.land #mbar{display:grid;position:fixed;left:0;right:0;top:0;z-index:5;background:#F6F5F1EB;-webkit-backdrop-filter:blur(12px);backdrop-filter:blur(12px);border-bottom:1px solid var(--line);padding:calc(env(safe-area-inset-top) + 8px) max(12px,env(safe-area-inset-right)) 8px max(12px,env(safe-area-inset-left));gap:8px 6px;align-items:center;-webkit-user-select:none;user-select:none}
body.phone #mbar{grid-template-columns:1fr auto auto;grid-template-areas:"t f m" "s s s"}
body.land #mbar{grid-template-columns:auto minmax(240px,360px) 1fr auto auto;grid-template-areas:"t s . f m";padding-top:6px;padding-bottom:6px}
.mt{grid-area:t;min-width:0}
.mt b{display:block;font:700 17px/1.15 var(--sans);letter-spacing:-.015em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.mt span{display:block;font:600 9.5px var(--mono);letter-spacing:.06em;text-transform:uppercase;color:var(--warn);margin-top:2px}
.mic{width:40px;height:40px;border-radius:50%;border:1px solid var(--line-2);background:#fff;display:grid;place-items:center;color:var(--ink)}
#m-find{grid-area:f} #m-menu{grid-area:m}
.mseg{grid-area:s;display:flex;gap:3px;padding:3px;border-radius:11px;background:var(--paper-2);border:1px solid var(--line)}
.mseg button{flex:1;height:34px;border-radius:8px;font:600 13px var(--sans);color:var(--ink-2);padding:0 2px}
.mseg button[aria-pressed="true"]{background:#fff;color:var(--ink);box-shadow:0 1px 3px #00000024}
body.phone #sheet{top:auto;left:0;right:0;bottom:0;width:auto;height:var(--sheet-h,60vh);border-left:0;border-top:1px solid var(--line-2);border-radius:16px 16px 0 0;box-shadow:0 -10px 30px #0000001f;transform:translateY(var(--sheet-off,0px));transition:transform .32s cubic-bezier(.2,.85,.25,1);z-index:6}
body.phone #sheet.drag{transition:none}
@media (prefers-reduced-motion:reduce){body.phone #sheet{transition:none}}
body.phone #sheet[data-state="peek"] #panel,body.phone #sheet[data-state="half"] #panel{overflow:hidden;touch-action:none}
body.phone #grab{display:block;position:relative;height:28px;flex:none;touch-action:none}
#grab-btn{position:absolute;inset:0;display:grid;place-items:center;width:100%}
#grab-btn i{display:block;width:40px;height:5px;border-radius:3px;background:var(--line-2)}
#sheet-x{position:absolute;right:10px;top:8px;width:34px;height:34px;border-radius:50%;border:1px solid var(--line-2);background:#fff;font-size:19px;line-height:1;color:var(--ink-2);z-index:1}
body.phone #panel{padding:0 16px calc(28px + env(safe-area-inset-bottom));overscroll-behavior:contain;-webkit-overflow-scrolling:touch}

body.land #drawer{right:320px;bottom:var(--timeh)}

.lstrip-k{font:600 10.5px var(--mono);letter-spacing:.06em;text-transform:uppercase;color:var(--muted);margin-top:12px}
body.phone .lchip,body.land .lchip{flex:none}
body.phone #tour{left:10px;right:10px;width:auto;top:calc(var(--mtop) + 10px);bottom:auto;z-index:8}
body.land #tour{left:10px;width:340px;top:auto;bottom:calc(var(--timeh) + 8px);z-index:8}

body.phone #mscrim:not([hidden]),body.land #mscrim:not([hidden]){display:block}
#mmenu{position:fixed;right:10px;top:calc(var(--mtop) + 6px);width:min(310px,calc(100vw - 20px));max-height:calc(var(--vh) - var(--mtop) - 20px);overflow:auto;background:#fff;border:1px solid var(--line-2);border-radius:14px;box-shadow:0 16px 44px #00000038;padding:6px;z-index:9}

<body>
<canvas id="stage" aria-label="Map of tokenized money and assets: who issues them, where they settle and what backs them. Use the entity buttons in the side panel to explore without a pointer."></canvas>
<div id="bsv"></div>
<div id="msg">Loading the ledger…</div>

<header>
  <div id="edition" hidden></div>
  <div class="hrow"><h1>The Tokenization Buildout Ledger</h1>
  <div class="tools">
    <input id="find" list="find-list" placeholder="Find a player" aria-label="Find a player" autocomplete="off"><datalist id="find-list"></datalist>
    <button class="btn" id="b-reset" hidden>Put everything back</button>
    <button class="btn" id="b-loops" hidden aria-pressed="false" title="Suppliers putting money into their own customers">Loops</button>
    <button class="btn" id="b-tower" hidden aria-pressed="false" title="Pull a player out and see who is left exposed">Tower</button>
    <button class="btn" id="b-checks" aria-pressed="false">Checks</button>
    <button class="btn" id="b-tour">Tour</button>
    <button class="btn" id="b-export">Export PNG</button>
  </div></div>
  <p class="sub">What is outstanding on-chain, who issues it, where it settles and what backs it, read from chains, attestations and filings. Every line is a sourced row.</p>
  <div class="stats" id="stats"></div>
  <div class="vbar"><div class="vtabs" role="group" aria-label="View"><button class="btn" id="b-layers" aria-pressed="true" title="Where reserves are held, what backs each token, and the chains it is on">Balance sheet</button><button class="btn" id="b-flow" aria-pressed="false" title="Which player issues, distributes, tokenizes, runs a ledger, holds reserves and is chartered">Roles</button><button class="btn" id="b-labels" aria-pressed="false" title="Counted dollar tokens over time, with rules, charters and deals marked">Time</button><button class="btn" id="b-rows" aria-pressed="false">Rows</button></div></div>
</header>



<section id="drawer" aria-live="polite"><button id="d-close" aria-label="Close">×</button><div id="drawer-body"></div></section>
<div id="tour" hidden role="dialog" aria-label="Guided start"><div class="kicker" id="tour-k"></div><p id="tour-t"></p><div class="acts"><button class="btn" id="tour-skip">Skip</button><button class="btn on" id="tour-next">Next</button></div></div>
<aside id="sheet" aria-label="Details" data-state="peek"><div id="grab"><button id="grab-btn" aria-label="Show details"><i></i></button><button id="sheet-x" aria-label="Close" hidden>×</button></div><div id="panel" aria-live="polite"></div></aside>
<div id="mbar">
  <div class="mt"><b>The Tokenization Buildout Ledger</b><span id="m-ed" hidden></span></div>
  <div class="mseg" role="tablist" aria-label="View"><button data-mv="map" aria-pressed="true">Balance</button><button data-bv="roles" aria-pressed="false">Roles</button><button data-bv="time" aria-pressed="false">Time</button><button data-mv="loops" aria-pressed="false" style="display:none">Loops</button><button data-mv="deals" aria-pressed="false">Rows</button><button data-mv="tower" aria-pressed="false" style="display:none">Tower</button></div>
  <button class="mic" id="m-find" aria-label="Find a player"><svg width="18" height="18" viewBox="0 0 18 18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="7.5" cy="7.5" r="5.5"/><path d="M11.8 11.8 16 16"/></svg></button>
  <button class="mic" id="m-menu" aria-label="More options" aria-haspopup="true"><svg width="18" height="18" viewBox="0 0 18 18" fill="currentColor"><circle cx="3.5" cy="9" r="1.8"/><circle cx="9" cy="9" r="1.8"/><circle cx="14.5" cy="9" r="1.8"/></svg></button>
</div>
<div id="mscrim" hidden></div>
<div id="mmenu" role="menu" hidden></div>
<div id="msearch" hidden role="dialog" aria-label="Find a player"><div class="ms-bar"><input id="ms-in" type="search" placeholder="Find a player" autocomplete="off" enterkeyhint="search" aria-label="Find a player"><button id="ms-x">Cancel</button></div><div id="ms-list"></div></div>
<button id="m-fit" hidden>Fit to width</button>
<div id="sab"></div>

<div id="time">
  <div class="trow">
    <button id="play" aria-label="Play timeline">▶</button>
    <div id="asof" class="num"></div>
    <div class="track">
      <div class="ticks" id="ticks"></div>
      <input id="scrub" type="range" min="0" max="100" step="1" value="100" aria-label="Show the ledger as of this date">
    </div>
    <button id="b-key" class="desk-only" aria-pressed="false" title="What the colours and outlines mean">Key</button>
  </div>
  <div class="legend" id="legend"></div>
</div>
<button id="p-tog" class="desk-only" aria-label="Hide the panel" title="Hide the panel">Hide ›</button>

<script>
(() => {

const TYPE = {issued:'Balance outstanding', settles:'Balance on a chain', holding:'Reserves and holdings', equity:'Equity and acquisitions', debt:'Debt', issues:'Issues', tokenizes:'Tokenizes', custody:'Custody', manages:'Manages reserves', distributes:'Distributes', partner:'Partner', licensed:'Licence or charter', owns:'Owns'};

const KIND = {company:'Company', product:'Token', ledger:'Settlement ledger', instrument:'Reserve fund', investor:'Investor', government:'Regulator'};
const LAYERS = [{id:'distribution',label:'Distribution',y:-370},{id:'instruments',label:'Instruments and issuers',y:-185},{id:'issuance',label:'Issuance platforms',y:0},{id:'ledgers',label:'Settlement ledgers',y:185},{id:'reserves',label:'Reserves and custody',y:370}];

const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

const fromN = n => new Date(n * 864e5).toISOString().slice(0,10);
const reduce = matchMedia('(prefers-reduced-motion: reduce)').matches;

const isMoney = f => MONEYT.has(f.type);
const ease = t => t * t * (3 - 2 * t);

let L, ents = {}, nodes = {}, homeMap = {}, homeCake = {}, T0, T1, tNow, sel = null, hover = null, drawer = null, allLabels = false, loopTab = 'map';
let mGoal = 0, mBlend = 0, fGoal = 0, fBlend = 0, homeFlow = {}, FL = null;
let showMode = 'all', traceDir = 'down', PENDING = new Set(), HEAD = null;
const PAPER = css('--paper');
const cam = {x:0, y:0, k:1, goal:null};
const cv = $('#stage'), ctx = cv.getContext('2d');
let W = 0, H = 0, DPR = 1, panelW = 376, wide = true;
let phone = false, land = false, RECT = null, MTOP = 0, SAB = 0, TIMEH = 0, homeStack = {}, SB = null, ORDER = null, lastStackW = 0, lastCls = '';
let touring = false, TOURB = 0, sheetState = 'peek', VIEW = null, inert = null, PINCH = false, fitShown = false, dealF = 'all', LEGEND = '';
// phones get their own arrangement: portrait phones a bottom sheet, landscape phones a narrow side panel
function classify(){

  land = small && W > H && H <= 500; phone = small && !land; wide = !small; panelW = wide ? 376 : land ? 320 : 0;

  return phone ? 'phone' : land ? 'land' : 'wide';

classify();

fetch('ledger.json').then(r => { if (!r.ok) throw new Error(r.status); return r.json(); }).then(init)
  .catch(e => { $('#msg').textContent = 'The ledger file could not be loaded (' + e.message + '). Reload the page; if it persists, the latest run did not publish.'; });

function init(data){
  L = data; $('#msg').remove();
  if (L.edition){   // a frozen copy for an article: says so, and points to the live map
    const ed = $('#edition'); ed.hidden = false;
    ed.innerHTML = `Edition of ${esc(day(L.edition.date))} · frozen; the daily updates continue on <a href="${esc(L.edition.live_url)}" target="_blank" rel="noopener">the live map</a>`;

  const sc = $('#scrub'); sc.min = T0; sc.max = T1; sc.value = T1;
  sc.addEventListener('input', () => { stopPlay(); tNow = +sc.value; refresh(); });

  refresh(); layout();
  buildTicks(); buildLegend(); renderPanel();
  addEventListener('resize', resize); resize();
  bindPointer(); bindTools(); bindPhone();
  const h0 = location.hash;
  if (!wide) setMode('layers', true);   // on a phone the map opens as the stack
  const linked = fromHash(h0); addEventListener('hashchange', () => fromHash());
  let seen = false; try { seen = localStorage.getItem('tbl-tour') === '1'; } catch (_) {}
  if (!linked && !seen) setTimeout(() => tour(0), 700);
  if (document.fonts) document.fonts.ready.then(() => { sizeCache = {}; });
  requestAnimationFrame(frame);
  if (/[?&]debug\b/.test(location.search)) window.__L = {view, toScreen, home, nodes, cam, select, setSheet, st: () => ({cls: document.body.className, k: +cam.k.toFixed(3), RECT, SB: SB && {BW: Math.round(SB.BW), h: Math.round(SB.height), bands: SB.bands.map(b => [b.id, b.ids.length, Math.round(b.h)]), big: Object.keys(homeStack).map(id => [id, Math.round(size(id).w), Math.round(size(id).h)]).sort((a, b) => b[1] - a[1]).slice(0, 8)}, s: +view().s.toFixed(3), sheet: sheetState, sel, drawer, mode: modeNow(), hash: location.hash})};
}

/* ---------- body shapes and sizes (world units) ---------- */
let sizeCache = {};
const BASE = 15;   // body type size in world units; bodies are sized so their names always fit inside
const MINF = [10.5, 9.5];   // smallest on-screen name size: the map and five layers, then the arranged view
let BS = 1;        // when zoomed far out, bodies grow on screen so names never drop below a readable size
const PLAN = {cake: 1.7, flow: 1.7};   // ...but never past the growth each arranged layout was spaced for, so bodies never collide
function bodyFont(px){ return `600 ${px}px ${SANS}`; }
function wrap(c, text, maxW){
  const words = text.split(' '); if (words.length === 1) return [text];
  let best = [text];
  for (let i = 1; i < words.length; i++){ const a = words.slice(0, i).join(' '), b = words.slice(i).join(' '); if (Math.max(c.measureText(a).width, c.measureText(b).width) < Math.max(...best.map(x => c.measureText(x).width))) best = [a, b]; }
  return c.measureText(text).width <= maxW ? [text] : best;
}
function size(id){
  const e = ents[id], tot = (V.total[id] || 0) / 1e9, key = id + '|' + Math.round(tot) + (wide ? '' : 'p'), P = !wide;   // phones draw compact bodies
  if (sizeCache[key]) return sizeCache[key];
  ctx.font = bodyFont(BASE);
  let s;
  if (e.kind === 'product'){ const w = ctx.measureText(e.name).width + (P ? 26 : 32); s = {shape:'pill', w, h:P ? 32 : 36, r:w / 2}; }
  else if (e.kind === 'instrument'){ const w = Math.max(ctx.measureText(e.name).width + (P ? 40 : 48), P ? 100 : 120); s = {shape:'tag', w, h:P ? 42 : 50, r:w / 2}; }
  else if (e.kind === 'sink'){ const lines = wrap(ctx, e.name, 130), w = Math.max(P ? 128 : 150, ...lines.map(l => ctx.measureText(l).width + (P ? 28 : 34))); const side = Math.max(w, P ? 60 + Math.sqrt(tot) * 1.2 : 80 + Math.sqrt(tot) * 2.4); s = {shape:'sink', w:side, h:Math.max(P ? 64 : 78, side * (P ? 0.5 : 0.62)), r:side / 2, lines}; }
  else if (P){   // phones: a chip with the name and, beside it, the money it touches; more money, a larger chip
    const inv = e.kind !== 'company', lines = ctx.measureText(e.name).width > 200 ? wrap(ctx, e.name, 200) : [e.name], tw = Math.max(...lines.map(l => ctx.measureText(l).width));
    ctx.font = `500 ${BASE * 0.8}px ${MONO}`; const am = V.total[id] ? ctx.measureText(money(V.total[id])).width + 7 : 0;
    const g = Math.min(1, Math.sqrt(tot) / 28), w = tw + am + 26 + (inv ? 8 : 0) + g * 22, h = 32 + (lines.length - 1) * 17 + (inv ? 12 : 0) + g * 16;
    s = {shape: inv ? 'ichip' : 'chip', w, h, r: Math.min(w, h) / 2, lines, am};
  }
  else {
    const lines = wrap(ctx, e.name, 104), tw = Math.max(...lines.map(l => ctx.measureText(l).width));
    const fit = Math.max(tw / 2 + 11, lines.length > 1 ? 36 : 28) + (e.kind === 'investor' || e.kind === 'government' ? 8 : 0);
    const r = Math.min(78, Math.max(fit, 26 + Math.sqrt(tot) * 1.4));
    s = {shape: e.kind === 'investor' || e.kind === 'government' ? 'investor' : 'circle', w:r * 2, h:r * 2, r, lines};
  }
  return sizeCache[key] = s;
}
function inside(id, p, pad){
  const n = nodes[id], s0 = size(id), s = {shape: s0.shape, w: s0.w * BS, h: s0.h * BS, r: s0.r * BS};
  if (s.shape === 'circle' || s.shape === 'investor') return Math.hypot(p.x - n.x, p.y - n.y) < s.r + pad;
  return Math.abs(p.x - n.x) < s.w / 2 + pad && Math.abs(p.y - n.y) < s.h / 2 + pad;

/* ---------- arrangements: a mind map from a force layout, and the five-layer stack ---------- */
function hash(s){ let h = 2166136261; for (const c of s) h = Math.imul(h ^ c.charCodeAt(0), 16777619); return ((h >>> 0) % 10000) / 10000; }

function wrap2(name){ const w = name.split(' '); let best = [name], bw = 1e9; for (let i = 1; i < w.length; i++){ const a = w.slice(0, i).join(' '), b = w.slice(i).join(' '), m = Math.max(a.length, b.length); if (m < bw){ bw = m; best = [a, b]; } } return best; }
